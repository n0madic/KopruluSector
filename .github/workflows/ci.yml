name: ci
on: [push, pull_request]
jobs:
  check:
    # Original game data is private, so CI runs everything except the tests
    # that need KOPRULU_ORIGINAL (they are skipped). The native build is CMake
    # with Ninja (phase S, ADR 0012); tools/ci.sh fetches the pinned SDL sources.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake, Ninja and StormLib
        run: |
          brew install cmake ninja stormlib
      - name: Check
        env:
          KOPRULU_FULL: "1" # a push's check, and a hosted run remembers no passes that the quick mode could save time on
        run: tools/ci.sh
