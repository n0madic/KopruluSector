name: ci
on: [push, pull_request]
jobs:
  check:
    # Original game data is private, so CI runs everything except the tests
    # that need KOPRULU_ORIGINAL (they are skipped).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install LuaJIT, StormLib and pytest
        run: |
          brew install luajit stormlib
          python3 -m pip install --break-system-packages pytest
      - name: Check
        run: tools/ci.sh
